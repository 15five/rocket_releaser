version: 2.1


parameters:
  version:
    type: string
    default: "3.12"

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
        auth:
          username: fforchestration
          password: $DOCKERHUB_PASSWORD
    steps:
      - checkout
      - run:
          name: install python dependencies
          command: make dev
      - run:
          name: lint
          command: make lint
  test-python:
    docker:
      - image: cimg/python:<< pipeline.parameters.version >>
    steps:
      - checkout
      - run:
          name: install python dependencies
          command: make dev
      - run:
          name: run tests
          command: |
            mkdir test-results
            coverage run --source=. --omit=venv/* -m pytest --junitxml=test-results/junit.xml
            coverage report -m
            coverage html
      - run:
          name: run integration test
          command: |
            python -m rocket_releaser $GITHUB_TOKEN 82a86d4 9253704 15five rocket_releaser --vpc_name production_1 --env_name production --search_branch master
      - run:
          name: Compress Artifacts
          command: tar -cvf htmlcov.tar htmlcov
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: htmlcov.tar
  integration:
    docker:
      - image: cimg/python:3.12
    steps:
      - run: echo "It works!"
      - run: echo $RUN_EXTRA_TESTS
  deploy:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      # see https://github.com/pypa/pip/issues/4537 for why we need to install_egg_info
      - run:
          name: install python dependencies
          command: |
            python3 -m venv venv
            python setup.py install_egg_info
            make dev
      - run:
          name: init .pypirc
          command: |
            echo -e "[pypi]" >> ~/.pypirc
            echo -e "username = __token__" >> ~/.pypirc
            echo -e "password = $PYPI_PASSWORD" >> ~/.pypirc
      - run:
          name: create packages
          command: |
            make package
      - run:
          name: upload to pypi
          command: |
            twine upload dist/*

workflows:
  lint_and_test_pr:
    jobs:
      - lint:
          filters:
            branches:
              ignore:
                - master
      - test-python:
          name: test-python
          requires:
            - lint
  lint_test_deploy:
    jobs:
      - lint:
          filters:
            branches:
              only:
                - master
      - test-python:
          name: test-python
          requires:
            - lint
      - deploy:
          # requires:
          #   - hold-deploy
          requires:
            - test-python
